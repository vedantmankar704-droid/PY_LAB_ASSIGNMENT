<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Voting System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📊 VOTING RESULTS</h1>
            <button class="btn btn-secondary" onclick="goBack()">← BACK</button>
        </div>

        <!-- Results Display -->
        <div class="results-container">
            <!-- Statistics -->
            <div class="stats-section">
                <h2>📈 Current Statistics</h2>
                <div id="detailedResults" class="detailed-results"></div>
                
                <div class="stats-box">
                    <div class="stat-item">
                        <p>Total Votes</p>
                        <h3 id="totalVotesDisplay">0</h3>
                    </div>
                    <div class="stat-item">
                        <p>Leader</p>
                        <h3 id="winnerDisplay">No votes yet</h3>
                    </div>
                </div>
            </div>

            <!-- Chart -->
            <div class="chart-section">
                <h2>📊 Vote Distribution</h2>
                <canvas id="votesChart" width="400" height="300"></canvas>
            </div>
        </div>

        <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
    </div>

    <script>
        let chart = null;

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function loadResults() {
            fetch('/api/results')
                .then(response => response.json())
                .then(data => {
                    displayResults(data);
                    displayChart(data);
                })
                .catch(error => {
                    showError('Failed to load results: ' + error.message);
                });
        }

        function displayResults(data) {
            // Display detailed results
            const detailedResults = document.getElementById('detailedResults');
            detailedResults.innerHTML = '';

            data.results.forEach(result => {
                const resultDiv = document.createElement('div');
                resultDiv.className = 'result-card';
                resultDiv.innerHTML = `
                    <div class="result-header">
                        <span class="candidate-name">${result.name}</span>
                        <span class="vote-stats">${result.votes} votes</span>
                    </div>
                    <div class="result-bar">
                        <div class="result-fill" style="width: ${result.percentage}%"></div>
                    </div>
                    <div class="result-percentage">${result.percentage}%</div>
                `;
                detailedResults.appendChild(resultDiv);
            });

            // Display totals
            document.getElementById('totalVotesDisplay').textContent = data.total_votes;
            document.getElementById('winnerDisplay').textContent = data.winner || 'No votes yet';
        }

        function displayChart(data) {
            const ctx = document.getElementById('votesChart').getContext('2d');
            const labels = data.results.map(r => r.name);
            const votes = data.results.map(r => r.votes);
            const colors = ['#3498DB', '#E74C3C', '#27AE60', '#F39C12'];

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: votes,
                        backgroundColor: colors.slice(0, labels.length),
                        borderColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                font: { size: 14 },
                                padding: 20
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.label + ': ' + context.parsed + ' votes';
                                }
                            }
                        }
                    }
                }
            });
        }

        function goBack() {
            window.location.href = '/voting';
        }

        // Load results on page load
        window.addEventListener('load', () => {
            loadResults();
            
            // Refresh results every 3 seconds
            setInterval(loadResults, 3000);
        });
    </script>
</body>
</html>
