<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cast Your Vote - Voting System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1>🗳️ CAST YOUR VOTE</h1>
                <p class="voter-info">Voter ID: <strong>{{ voter_id }}</strong></p>
            </div>
            <div class="header-right">
                <button class="btn btn-secondary" onclick="logout()">LOGOUT</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="voting-content">
            <!-- Candidates Section -->
            <div class="candidates-section">
                <h2>Select a Candidate</h2>
                <div id="candidatesList" class="candidates-list"></div>
                
                <div class="voting-buttons">
                    <button class="btn btn-success" onclick="submitVote()">✓ SUBMIT VOTE</button>
                    <button class="btn btn-info" onclick="goToResults()">📊 VIEW RESULTS</button>
                </div>
            </div>

            <!-- Live Results Section -->
            <div class="results-section">
                <h2>📊 Live Results</h2>
                <div id="liveResults" class="live-results"></div>
                <div class="vote-counter">
                    Total Votes: <strong id="totalVotes">0</strong>
                </div>
            </div>
        </div>

        <!-- Messages -->
        <div id="successMessage" class="alert alert-success" style="display: none;"></div>
        <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
    </div>

    <script>
        let selectedCandidateId = null;

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        function loadCandidates() {
            fetch('/api/candidates')
                .then(response => response.json())
                .then(candidates => {
                    const candidatesList = document.getElementById('candidatesList');
                    candidatesList.innerHTML = '';

                    candidates.forEach(candidate => {
                        const radioButton = document.createElement('label');
                        radioButton.className = 'candidate-option';
                        radioButton.innerHTML = `
                            <input type="radio" name="candidate" value="${candidate.id}" 
                                   onchange="selectedCandidateId = ${candidate.id}">
                            <span class="candidate-label">${candidate.name}</span>
                        `;
                        candidatesList.appendChild(radioButton);
                    });
                })
                .catch(error => {
                    showError('Failed to load candidates: ' + error.message);
                });
        }

        function loadResults() {
            fetch('/api/results')
                .then(response => response.json())
                .then(data => {
                    const liveResults = document.getElementById('liveResults');
                    liveResults.innerHTML = '';

                    data.results.forEach(result => {
                        const percentage = result.percentage || 0;
                        const barWidth = Math.min(percentage, 100);
                        
                        const resultDiv = document.createElement('div');
                        resultDiv.className = 'result-item';
                        resultDiv.innerHTML = `
                            <div class="result-header">
                                <span>${result.name}</span>
                                <span>${result.votes} votes (${percentage}%)</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${barWidth}%"></div>
                            </div>
                        `;
                        liveResults.appendChild(resultDiv);
                    });

                    document.getElementById('totalVotes').textContent = data.total_votes;
                })
                .catch(error => {
                    showError('Failed to load results: ' + error.message);
                });
        }

        function submitVote() {
            if (!selectedCandidateId) {
                showError('Please select a candidate to vote for!');
                return;
            }

            fetch('/api/vote', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    candidate_id: selectedCandidateId
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showSuccess('✓ ' + data.message);
                    selectedCandidateId = null;
                    document.querySelectorAll('input[name="candidate"]').forEach(radio => radio.checked = false);
                    loadResults();
                } else {
                    showError(data.error || 'Failed to submit vote');
                }
            })
            .catch(error => {
                showError('Connection error: ' + error.message);
            });
        }

        function goToResults() {
            window.location.href = '/results';
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                fetch('/api/logout', { method: 'POST' })
                    .then(() => {
                        window.location.href = '/';
                    });
            }
        }

        // Load candidates and results on page load
        window.addEventListener('load', () => {
            loadCandidates();
            loadResults();
            
            // Refresh results every 2 seconds
            setInterval(loadResults, 2000);
        });
    </script>
</body>
</html>
